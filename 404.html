      (function () {
        const swap = (img) => {
          if (!img || img.tagName !== 'IMG') return;
          const src = img.getAttribute('src') || '';
          if (src.includes('/home/') && src.endsWith('.jpeg')) {
            img.setAttribute('src', src.replace(/\.jpeg$/, '.svg'));
          }
        };
        const scan = (root) => root.querySelectorAll && root.querySelectorAll('img').forEach(swap);
        const mo = new MutationObserver((muts) => {
          muts.forEach((m) => {

            });
          });
        });
        mo.observe(document.documentElement, { subtree: true, childList: true, attributes: true, attributeFilter: ['src'] });
      })();
